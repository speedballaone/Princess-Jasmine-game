function drawWorld3D(){if(!gl)return;if(!shaderProgram){try{createProgram()}catch(err){screen.style.display='grid';screen.querySelector('.card').innerHTML='<div class="title">3D Graphics Unavailable</div><div class="sub">This browser could not start WebGL.</div>';return}}
